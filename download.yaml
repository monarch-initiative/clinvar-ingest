### This file is a YAML configuration that specifies
### the data to be downloaded and ingested for this project.
### The configuration is used by `kghub-downloader`.
### For more information, see https://github.com/monarch-initiative/kghub-downloader
---
- url: https://ftp.ncbi.nlm.nih.gov/pub/clinvar/vcf_GRCh38/clinvar.vcf.gz
  local_name: data/clinvar.vcf.gz

- url: https://ftp.ncbi.nlm.nih.gov/pub/clinvar/vcf_GRCh38/clinvar.vcf.gz.tbi
  local_name: data/clinvar.vcf.gz.tbi

- url: https://ftp.ncbi.nlm.nih.gov/pub/clinvar/tab_delimited/submission_summary.txt.gz
  local_name: data/submission_summary.txt.gz

# ClinVar's curated per-variant gene attribution (GeneID / GeneSymbol / HGNC_ID).
# Used instead of the VCF's GENEINFO field, which lists every locus overlapping the
# variant position -- see make_variant_gene_map() in src/clinvar_helpers.py.
- url: https://ftp.ncbi.nlm.nih.gov/pub/clinvar/tab_delimited/variant_summary.txt.gz
  local_name: data/variant_summary.txt.gz

# Per-variant literature links. Used to admit <=1-star calls under the weaker
# associated_with predicate -- see load_pubmed_variants() in src/clinvar_helpers.py.
- url: https://ftp.ncbi.nlm.nih.gov/pub/clinvar/tab_delimited/var_citations.txt
  local_name: data/var_citations.txt

- url: https://data.monarchinitiative.org/mappings/latest/mondo.sssom.tsv
  local_name: data/mondo.sssom.tsv

- url: https://ftp.ncbi.nlm.nih.gov/pub/medgen/MedGenIDMappings.txt.gz
  local_name: data/MedGenIDMappings.txt.gz
